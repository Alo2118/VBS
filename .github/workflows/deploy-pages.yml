name: Deploy PWA su GitHub Pages

# Pubblica la PWA (apps/web) su GitHub Pages a ogni push.
# Richiede:
#  - Settings > Pages > Source: "GitHub Actions"
#  - Settings > Secrets and variables > Actions:
#      VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (dal progetto Supabase)
on:
  push:
    branches: [main, claude/busy-curie-qRYBR]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build web (PWA)
        run: npm run build --workspace apps/web
        env:
          # Project page servita sotto /<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Fallback SPA (404 -> index)
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
